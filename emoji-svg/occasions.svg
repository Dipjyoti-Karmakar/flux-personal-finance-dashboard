<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 191" width="100%" height="100%">
  <defs>
    <!-- Soft Shadows -->
    <filter id="calShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <filter id="balloonShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#700A2C" flood-opacity="0.3" />
    </filter>

    <filter id="giftShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#552200" flood-opacity="0.35" />
    </filter>

    <!-- Gradients -->
    <!-- Calendar Header -->
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Calendar Page -->
    <linearGradient id="calPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Balloon Gradient -->
    <radialGradient id="balloonGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="40%" stop-color="#EC4899" />
      <stop offset="85%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#831843" />
    </radialGradient>

    <!-- Gift Box Gradient -->
    <radialGradient id="giftBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- 1. PINK PARTY BALLOON (Top-Right, x: 181-255, y: 0-84) -->
  <g filter="url(#balloonShadow)">
    <!-- Balloon String dropping behind calendar -->
    <path d="M 218 84 C 215 105, 205 115, 208 140" fill="none" stroke="#C4B5FD" stroke-width="2.2" stroke-linecap="round" />
    <!-- Balloon Body -->
    <ellipse cx="218" cy="42" rx="34" ry="40" fill="url(#balloonGrad)" />
    <!-- Balloon Knot -->
    <polygon points="215,81 221,81 218,86" fill="#9D174D" />
    <!-- Specular Highlight -->
    <ellipse cx="208" cy="26" rx="9" ry="14" transform="rotate(-20 208 26)" fill="#FFFFFF" opacity="0.65" />
  </g>

  <!-- 2. STREAMERS & CONFETTI (Left Edge, x: 0-65, y: 25-115) -->
  <!-- Magenta Curly Ribbon -->
  <path d="M 32 105 C 12 75, 36 60, 18 36 C 12 25, 28 15, 40 18" fill="none" stroke="#EC4899" stroke-width="5" stroke-linecap="round" />
  <!-- Cyan Curly Ribbon -->
  <path d="M 45 110 C 60 85, 42 65, 62 45 C 70 36, 65 24, 52 20" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
  <!-- Confetti Dots -->
  <circle cx="35" cy="14" r="3.5" fill="#FBBF24" />
  <circle cx="62" cy="18" r="3.5" fill="#EC4899" />
  <circle cx="20" cy="50" r="3" fill="#06B6D4" />
  <circle cx="42" cy="65" r="3" fill="#FBBF24" />

  <!-- 3. CENTER CALENDAR (x: 54-191, y: 20-175) -->
  <g filter="url(#calShadow)">
    <!-- Calendar Easel Stand (Dark purple backing & base) -->
    <path d="M 54 165 L 180 165 C 188 165, 194 158, 194 150 L 198 60 L 192 172 L 54 172 Z" fill="#4C1D95" />

    <!-- Calendar Front Sheet Body -->
    <path d="M 68 36 L 178 36 C 185 36, 190 41, 191 48 L 196 163 C 197 170, 191 175, 184 175 L 60 175 C 53 175, 47 170, 48 163 L 53 48 C 54 41, 60 36, 68 36 Z" fill="url(#calPage)" />

    <!-- Calendar Top Purple Header Band -->
    <path d="M 68 36 L 178 36 C 185 36, 190 41, 191 48 L 192 65 L 51 65 L 53 48 C 54 41, 60 36, 68 36 Z" fill="url(#calHeader)" />

    <!-- 4 Spiral Binder Rings on Top -->
    <rect x="74" y="24" width="8" height="24" rx="4" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" />
    <rect x="104" y="24" width="8" height="24" rx="4" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" />
    <rect x="134" y="24" width="8" height="24" rx="4" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" />
    <rect x="164" y="24" width="8" height="24" rx="4" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" />

    <!-- Calendar Date Cells Grid (5 Columns x 4 Rows) -->
    <!-- Row 1 -->
    <rect x="68" y="76" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="92" y="76" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="116" y="76" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="140" y="76" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="164" y="76" width="16" height="15" rx="3.5" fill="#DDD6FE" />

    <!-- Row 2 -->
    <rect x="68" y="99" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="92" y="99" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <!-- Special Date: Purple Tile with Gleaming Gold Star! -->
    <rect x="116" y="98" width="18" height="17" rx="4" fill="#7C3AED" />
    <polygon points="125,100 127,105 132,105 128,108 130,113 125,110 120,113 122,108 118,105 123,105" fill="url(#starGrad)" />

    <rect x="140" y="99" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="164" y="99" width="16" height="15" rx="3.5" fill="#DDD6FE" />

    <!-- Row 3 -->
    <rect x="68" y="122" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="92" y="122" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="116" y="122" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="140" y="122" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="164" y="122" width="16" height="15" rx="3.5" fill="#DDD6FE" />

    <!-- Row 4 -->
    <rect x="68" y="145" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="92" y="145" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="116" y="145" width="16" height="15" rx="3.5" fill="#DDD6FE" />
    <rect x="140" y="145" width="16" height="15" rx="3.5" fill="#DDD6FE" />
  </g>

  <!-- 4. PARTY POPPER CONE (Bottom-Left, x: 0-69, y: 91-165) -->
  <g transform="translate(35, 140) rotate(-40)" filter="url(#calShadow)">
    <!-- Yellow Cone Base -->
    <path d="M -18 10 L 22 -15 L 22 35 L -18 10 Z" fill="#FBBF24" />
    <!-- Purple Stripes -->
    <path d="M -6 6 L 4 -1 L 4 23 L -6 18 Z" fill="#7C3AED" />
    <path d="M 12 -5 L 22 -11 L 22 31 L 12 27 Z" fill="#7C3AED" />
    <!-- Popper Rim Lip -->
    <ellipse cx="22" cy="10" rx="5" ry="24" fill="#F59E0B" />
  </g>

  <!-- 5. GOLDEN GIFT BOX (Bottom-Right, x: 181-254, y: 101-189) -->
  <g filter="url(#giftShadow)">
    <!-- Yellow Box Cube -->
    <rect x="184" y="125" width="68" height="60" rx="9" fill="url(#giftBody)" />

    <!-- Vertical Pink Ribbon Band -->
    <rect x="212" y="125" width="12" height="60" fill="url(#ribbonGrad)" />
    <!-- Horizontal Pink Ribbon Band -->
    <rect x="184" y="149" width="68" height="12" fill="url(#ribbonGrad)" />

    <!-- 3D Pink Ribbon Bow on Top -->
    <!-- Left Loop -->
    <path d="M 218 125 C 200 106, 180 118, 204 127 Z" fill="url(#ribbonGrad)" />
    <!-- Right Loop -->
    <path d="M 218 125 C 236 106, 256 118, 232 127 Z" fill="url(#ribbonGrad)" />
    <!-- Center Bow Knot -->
    <circle cx="218" cy="125" r="5.5" fill="#E11D48" />
  </g>
</svg>
