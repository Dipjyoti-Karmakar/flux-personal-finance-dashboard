<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Shadows -->
    <filter id="bagShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2E046E" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <filter id="tagShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#6B3000" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Bag Gradients -->
    <radialGradient id="bagGrad" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9A52FF" />
      <stop offset="40%" stop-color="#7C30F8" />
      <stop offset="80%" stop-color="#5E14DB" />
      <stop offset="100%" stop-color="#430BA8" />
    </radialGradient>

    <!-- Handle Gradients -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <!-- Price Tag Gradients -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Back Handle -->
  <path d="M 188 190 C 188 85, 290 85, 290 190" fill="none" stroke="#6D28D9" stroke-width="26" stroke-linecap="round" />

  <!-- Bag Body and Front Handle with Shadow -->
  <g filter="url(#bagShadow)">
    <!-- Bag Main Body Trapezoid -->
    <!-- Width: Top 240 (136 to 376), Bottom 290 (111 to 401), Height 220 (195 to 415) -->
    <path d="M 148 195 
             L 364 195 
             C 382 195, 396 208, 398 226 
             L 415 375 
             C 418 398, 400 418, 376 418 
             L 136 418 
             C 112 418, 94 398, 97 375 
             L 114 226 
             C 116 208, 130 195, 148 195 Z" fill="url(#bagGrad)" />

    <!-- Bag Top Opening Rim -->
    <path d="M 148 195 L 364 195" stroke="#B07BFF" stroke-width="8" stroke-linecap="round" />

    <!-- Left Side Crease / Gusset Highlight -->
    <path d="M 115 228 L 138 412" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round" />

    <!-- Front Handle -->
    <path d="M 220 230 C 220 100, 320 100, 320 230" fill="none" stroke="url(#handleGrad)" stroke-width="26" stroke-linecap="round" />

    <!-- Handle Grommet Rings on Bag Body -->
    <circle cx="220" cy="230" r="18" fill="#FFFFFF" stroke="#9333EA" stroke-width="4" />
    <circle cx="220" cy="230" r="8" fill="#5B21B6" />

    <circle cx="320" cy="230" r="18" fill="#FFFFFF" stroke="#9333EA" stroke-width="4" />
    <circle cx="320" cy="230" r="8" fill="#5B21B6" />
  </g>

  <!-- Hanging Price Tag on Right -->
  <g transform="translate(365, 275) rotate(16)" filter="url(#tagShadow)">
    <!-- Hanging String -->
    <path d="M -25 -55 C -25 -75, -5 -80, -2 -60" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Luggage Tag Body -->
    <path d="M -30 -45 
             L 30 -45 
             L 45 -20 
             L 45 65 
             C 45 76, 36 85, 25 85 
             L -25 85 
             C -36 85, -45 76, -45 65 
             L -45 -20 Z" fill="url(#tagGrad)" />

    <!-- Tag Hole -->
    <circle cx="0" cy="-28" r="8" fill="#FFFFFF" />

    <!-- White Shopping Cart Icon on Tag -->
    <g transform="translate(-18, 5) scale(0.75)" fill="#FFFFFF">
      <path d="M 0 5 L 8 5 L 16 30 L 42 30 L 48 12 L 14 12" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="20" cy="38" r="4.5" fill="#FFFFFF" />
      <circle cx="38" cy="38" r="4.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
