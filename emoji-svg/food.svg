<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow -->
    <filter id="bowlShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#001850" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <filter id="steamGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>

    <!-- Bowl Gradients -->
    <radialGradient id="bowlBody" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2D7DF8" />
      <stop offset="45%" stop-color="#145BD8" />
      <stop offset="80%" stop-color="#093DA8" />
      <stop offset="100%" stop-color="#042678" />
    </radialGradient>

    <linearGradient id="bowlRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5599FE" />
      <stop offset="40%" stop-color="#1C65E8" />
      <stop offset="100%" stop-color="#0A3FA8" />
    </linearGradient>

    <!-- Rice Gradient -->
    <radialGradient id="riceGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F8FAFC" />
      <stop offset="90%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Chopsticks Gradient -->
    <linearGradient id="chopstickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <g filter="url(#bowlShadow)">
    <!-- Bowl Back Wall & Foot Ring -->
    <ellipse cx="256" cy="442" rx="66" ry="14" fill="#042065" />
    <ellipse cx="256" cy="440" rx="64" ry="12" fill="#083896" />

    <!-- Outer Bowl Hemispherical Basin -->
    <path d="M 96 280 C 100 375, 170 435, 220 445 L 292 445 C 342 435, 412 375, 416 280 Z" fill="url(#bowlBody)" />

    <!-- Rice Mound inside the bowl -->
    <ellipse cx="256" cy="275" rx="150" ry="54" fill="url(#riceGrad)" />

    <!-- Chopsticks inserted INSIDE the rice in the bowl and extending out top-right -->
    <!-- Chopstick 1 -->
    <rect x="290" y="60" width="22" height="250" rx="11" transform="rotate(32 290 60)" fill="url(#chopstickGrad)" />
    <!-- Chopstick 2 -->
    <rect x="335" y="90" width="22" height="235" rx="11" transform="rotate(32 335 90)" fill="url(#chopstickGrad)" />

    <!-- Steam Curls emerging directly FROM inside the bowl's rice surface -->
    <g filter="url(#steamGlow)">
      <!-- Left Steam Curl: starts at (190, 275) deep in the rice, rising up -->
      <path d="M 188 280 C 182 235, 160 210, 160 170 C 160 130, 185 120, 190 95 C 193 80, 188 65, 178 50 C 196 64, 208 88, 204 112 C 200 138, 176 150, 178 180 C 180 208, 198 232, 206 280 Z" fill="url(#steamGrad)" />

      <!-- Right Steam Curl: starts at (240, 275) in the rice, rising up -->
      <path d="M 238 278 C 236 225, 215 195, 222 150 C 228 115, 260 90, 252 45 C 275 70, 276 110, 262 140 C 250 168, 238 186, 246 216 C 252 238, 266 254, 272 278 Z" fill="url(#steamGrad)" />
    </g>

    <!-- Front Bowl Rim Lip (curving across front, enclosing the rice) -->
    <path d="M 92 275 C 92 300, 165 320, 256 320 C 347 320, 420 300, 420 275" fill="none" stroke="url(#bowlRim)" stroke-width="26" stroke-linecap="round" />

    <!-- Specular Highlight on Rim Front Edge -->
    <path d="M 125 285 C 160 306, 210 316, 256 316 C 302 316, 352 306, 387 285" fill="none" stroke="#66A7FF" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
