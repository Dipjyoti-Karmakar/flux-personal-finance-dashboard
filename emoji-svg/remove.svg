<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#7A0B0B" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4A0505" flood-opacity="0.2" />
    </filter>

    <filter id="iconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#881313" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <radialGradient id="discGrad" cx="38%" cy="32%" r="65%" fx="35%" fy="28%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="35%" stop-color="#F84040" />
      <stop offset="70%" stop-color="#E22424" />
      <stop offset="90%" stop-color="#C51616" />
      <stop offset="100%" stop-color="#A51010" />
    </radialGradient>

    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA8A8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0" />
      <stop offset="100%" stop-color="#6B0707" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="canGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F6F7F9" />
      <stop offset="100%" stop-color="#E1E5EB" />
    </linearGradient>

    <linearGradient id="slotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Base 3D Disc -->
  <circle cx="256" cy="256" r="206" fill="url(#discGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#bevelGrad)" stroke-width="7" />

  <!-- Top Specular Highlight Arc -->
  <path d="M 100 210 C 130 110, 230 70, 360 84 C 330 72, 210 66, 120 150 C 95 174, 92 195, 100 210 Z" fill="url(#specularGlow)" />

  <!-- Trash Can Icon -->
  <g filter="url(#iconShadow)">
    <!-- Lid Handle -->
    <rect x="216" y="126" width="80" height="34" rx="17" fill="url(#canGrad)" />
    <!-- Lid Bar -->
    <rect x="148" y="152" width="216" height="40" rx="20" fill="url(#canGrad)" />
    <!-- Bucket Body -->
    <path d="M 166 200 L 346 200 L 328 362 C 325 377, 313 388, 297 388 L 215 388 C 199 388, 187 377, 184 362 Z" fill="url(#canGrad)" />

    <!-- 3 Vertical Slots -->
    <rect x="200" y="240" width="18" height="114" rx="9" fill="url(#slotGrad)" />
    <rect x="247" y="240" width="18" height="114" rx="9" fill="url(#slotGrad)" />
    <rect x="294" y="240" width="18" height="114" rx="9" fill="url(#slotGrad)" />
  </g>
</svg>
