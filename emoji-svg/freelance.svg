<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Shadows -->
    <filter id="deskShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <filter id="coinShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#78350F" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Laptop Gradients -->
    <linearGradient id="laptopBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="laptopBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Avatar Circle -->
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Coffee Mug -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Coin Gradients -->
    <radialGradient id="coinFace" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <linearGradient id="coinRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <g filter="url(#deskShadow)">
    <!-- Upright Laptop Screen -->
    <rect x="180" y="115" width="240" height="175" rx="26" fill="url(#laptopBezel)" />
    <!-- Screen Display Area -->
    <rect x="195" y="130" width="210" height="145" rx="16" fill="url(#screenGrad)" />

    <!-- User Avatar Icon on Screen -->
    <circle cx="300" cy="202" r="52" fill="url(#avatarBg)" />
    <!-- Avatar Head -->
    <circle cx="300" cy="186" r="18" fill="#FFFFFF" />
    <!-- Avatar Torso -->
    <path d="M 278 226 C 278 208, 322 208, 322 226 Z" fill="#FFFFFF" />

    <!-- Laptop Base / Keyboard Deck in Perspective -->
    <path d="M 125 330 
             L 190 290 
             L 410 290 
             L 375 375 
             C 370 388, 354 396, 338 396 
             L 132 396 
             C 112 396, 102 380, 108 362 Z" fill="url(#laptopBase)" />

    <!-- Keyboard Keys Grid Block -->
    <path d="M 175 300 L 375 300 L 355 352 L 140 352 Z" fill="#312E81" opacity="0.85" rx="6" />

    <!-- Trackpad -->
    <rect x="220" y="360" width="75" height="28" rx="8" fill="#6366F1" opacity="0.6" />
  </g>

  <!-- Coffee Mug on Left -->
  <g filter="url(#deskShadow)">
    <!-- Steam Curls -->
    <path d="M 125 210 C 120 180, 140 160, 130 135 C 138 150, 132 170, 138 185 C 142 195, 135 205, 132 210 Z" fill="url(#steamGrad)" />
    <path d="M 148 205 C 145 185, 160 170, 152 150 C 158 162, 155 178, 160 190 Z" fill="url(#steamGrad)" />

    <!-- Handle on Left -->
    <path d="M 98 255 C 65 255, 65 315, 98 315" fill="none" stroke="url(#mugGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Mug Cylinder Body -->
    <rect x="92" y="235" width="76" height="96" rx="20" fill="url(#mugGrad)" />
    <!-- Mug Rim & Coffee Liquid -->
    <ellipse cx="130" cy="245" rx="36" ry="14" fill="#3B1D11" />
  </g>

  <!-- Gold Rupee Coin on Front-Right -->
  <g filter="url(#coinShadow)">
    <circle cx="395" cy="335" r="60" fill="url(#coinFace)" stroke="url(#coinRim)" stroke-width="8" />
    <circle cx="395" cy="335" r="49" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4" />
    <text x="395" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="70" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="drop-shadow(0 2px 2px rgba(180,83,9,0.5))">₹</text>
  </g>
</svg>
