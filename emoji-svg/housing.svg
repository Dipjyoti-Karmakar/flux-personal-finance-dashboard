<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- House Shadow -->
    <filter id="houseShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#001845" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <filter id="keyShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#062E80" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F93FE" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1442B8" />
    </linearGradient>

    <linearGradient id="chimneyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#143DA5" />
    </linearGradient>

    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D7DF8" />
      <stop offset="100%" stop-color="#104BBE" />
    </linearGradient>

    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3880F8" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F389A" />
    </linearGradient>
  </defs>

  <g filter="url(#houseShadow)">
    <!-- Chimney on Right Roof Slope -->
    <rect x="336" y="125" width="54" height="100" rx="12" fill="url(#chimneyGrad)" />
    <rect x="330" y="116" width="66" height="18" rx="9" fill="#3B82F6" />

    <!-- Solid White House Body: completely fills under the roof from apex to base -->
    <path d="M 256 95 
             L 396 235 
             L 396 410 
             C 396 430, 380 445, 360 445 
             L 152 445 
             C 132 445, 116 430, 116 410 
             L 116 235 Z" fill="url(#wallGrad)" />

    <!-- Cobalt Blue Pitched Roof Gable -->
    <path d="M 80 250 L 256 84 L 432 250" fill="none" stroke="url(#roofGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arched Blue Doorway on Left -->
    <path d="M 162 445 L 162 355 C 162 332, 185 332, 196 332 C 207 332, 230 332, 230 355 L 230 445 Z" fill="url(#doorGrad)" />
  </g>

  <!-- 3D Blue Key in Center Front -->
  <g filter="url(#keyShadow)">
    <!-- Key Ring Head -->
    <circle cx="278" cy="246" r="44" fill="url(#keyGrad)" />
    <circle cx="278" cy="246" r="19" fill="#FFFFFF" />

    <!-- Key Shaft -->
    <rect x="267" y="284" width="22" height="110" rx="11" fill="url(#keyGrad)" />

    <!-- Key Teeth -->
    <rect x="284" y="328" width="30" height="18" rx="9" fill="url(#keyGrad)" />
    <rect x="284" y="362" width="24" height="18" rx="9" fill="url(#keyGrad)" />
  </g>
</svg>
