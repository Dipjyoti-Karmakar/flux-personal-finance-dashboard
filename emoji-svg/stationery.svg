<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Paper Shadow -->
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <!-- Pencil Shadow onto Paper & Desk -->
    <filter id="pencilShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="-6" dy="14" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.35" />
      <feDropShadow dx="-2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#DCE6F5" />
    </linearGradient>

    <!-- Blue Lines on Paper -->
    <linearGradient id="blueLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F93FE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Pencil Shaft Gradients (Faceted Hexagon) -->
    <linearGradient id="pencilMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="eraserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="40%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="ferruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Document Paper Sheet on the Left -->
  <g filter="url(#paperShadow)">
    <rect x="110" y="55" width="250" height="365" rx="38" fill="url(#paperGrad)" />

    <!-- 3 Blue Rounded Text Lines -->
    <rect x="155" y="130" width="120" height="22" rx="11" fill="url(#blueLine)" />
    <rect x="155" y="185" width="90" height="22" rx="11" fill="url(#blueLine)" />
    <rect x="155" y="240" width="50" height="22" rx="11" fill="url(#blueLine)" />
  </g>

  <!-- Big Chunky 3D Pencil Lying Diagonally (Eraser at top-right, Tip at bottom-left) -->
  <g transform="translate(290, 255) rotate(45)" filter="url(#pencilShadow)">
    <!-- Pink Eraser Dome (Top-Right) -->
    <path d="M -34 -155 C -34 -182, 34 -182, 34 -155 L 34 -125 L -34 -125 Z" fill="url(#eraserGrad)" />

    <!-- Silver/White Ferrule Collar Band -->
    <rect x="-34" y="-125" width="68" height="20" rx="3" fill="url(#ferruleGrad)" />

    <!-- Yellow Hexagonal Pencil Shaft -->
    <rect x="-34" y="-105" width="68" height="175" rx="4" fill="url(#pencilMain)" />

    <!-- Pencil Facet Lines -->
    <line x1="-12" y1="-105" x2="-12" y2="70" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" />
    <line x1="12" y1="-105" x2="12" y2="70" stroke="#B45309" stroke-opacity="0.3" stroke-width="3" />

    <!-- Sharpened Beige Wood Cone -->
    <path d="M -34 70 L 0 148 L 34 70 Z" fill="url(#woodGrad)" />

    <!-- Dark Graphite Lead Tip -->
    <path d="M -15 114 L 0 148 L 15 114 Z" fill="#1E293B" />
  </g>
</svg>
