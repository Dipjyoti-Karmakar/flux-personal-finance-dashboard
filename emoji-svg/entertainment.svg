<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ticket Shadow -->
    <filter id="ticketShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="18" stdDeviation="16" flood-color="#36066B" flood-opacity="0.35" />
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <filter id="playShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3C0777" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Ticket Gradient -->
    <radialGradient id="ticketGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#8B3CF6" />
      <stop offset="70%" stop-color="#7022EA" />
      <stop offset="90%" stop-color="#5B12CE" />
      <stop offset="100%" stop-color="#4709A8" />
    </radialGradient>

    <!-- Ticket Top Rim Bevel -->
    <linearGradient id="ticketBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9333EA" stop-opacity="0" />
      <stop offset="100%" stop-color="#2E046E" stop-opacity="0.8" />
    </linearGradient>

    <!-- Play Icon Gradient -->
    <linearGradient id="whiteIconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#D9E2EC" />
    </linearGradient>
  </defs>

  <!-- Angled Ticket Group -->
  <g transform="translate(256, 256) rotate(-22)" filter="url(#ticketShadow)">
    <!-- Ticket Body with Notches -->
    <!-- Width: 380, Height: 210, Center: 0, 0 -->
    <path d="M -150 -105 
             L 150 -105 
             C 175 -105, 195 -85, 195 -60 
             L 195 -28 
             A 28 28 0 0 0 195 28 
             L 195 60 
             C 195 85, 175 105, 150 105 
             L -150 105 
             C -175 105, -195 85, -195 60 
             L -195 28 
             A 28 28 0 0 0 -195 -28 
             L -195 -60 
             C -195 -85, -175 -105, -150 -105 Z" fill="url(#ticketGrad)" stroke="url(#ticketBevel)" stroke-width="5" />

    <!-- Dashed Perforation Line on Left Section -->
    <g fill="#FFFFFF" opacity="0.85">
      <rect x="-115" y="-80" width="10" height="20" rx="5" />
      <rect x="-115" y="-45" width="10" height="20" rx="5" />
      <rect x="-115" y="-10" width="10" height="20" rx="5" />
      <rect x="-115" y="25" width="10" height="20" rx="5" />
      <rect x="-115" y="60" width="10" height="20" rx="5" />
    </g>

    <!-- White Play Triangle in Center -->
    <g filter="url(#playShadow)">
      <path d="M -8 -48 C -8 -58, 4 -64, 13 -58 L 74 -10 C 82 -4, 82 8, 74 14 L 13 62 C 4 68, -8 62, -8 52 Z" fill="url(#whiteIconGrad)" />
    </g>
  </g>
</svg>
