<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#002D80" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#001850" flood-opacity="0.2" />
    </filter>

    <filter id="iconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#073B98" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <radialGradient id="discGrad" cx="38%" cy="32%" r="65%" fx="35%" fy="28%">
      <stop offset="0%" stop-color="#4F93FE" />
      <stop offset="35%" stop-color="#2D7DF8" />
      <stop offset="70%" stop-color="#1B68EC" />
      <stop offset="90%" stop-color="#1057DC" />
      <stop offset="100%" stop-color="#0B46BD" />
    </radialGradient>

    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB8FF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0" />
      <stop offset="100%" stop-color="#062E80" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="playGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F6F7F9" />
      <stop offset="100%" stop-color="#E1E5EB" />
    </linearGradient>

    <linearGradient id="playHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Base 3D Disc -->
  <circle cx="256" cy="256" r="206" fill="url(#discGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#bevelGrad)" stroke-width="7" />

  <!-- Top Specular Highlight Arc -->
  <path d="M 100 210 C 130 110, 230 70, 360 84 C 330 72, 210 66, 120 150 C 95 174, 92 195, 100 210 Z" fill="url(#specularGlow)" />

  <!-- Play Triangle with Rounded Corners -->
  <g filter="url(#iconShadow)">
    <path d="M 198 172 C 198 152, 220 140, 237 151 L 343 234 C 358 244, 358 268, 343 278 L 237 361 C 220 372, 198 360, 198 340 Z" fill="url(#playGrad)" />
    <path d="M 200 174 C 200 156, 219 146, 235 156 L 341 236 C 354 246, 354 266, 341 276 L 235 356 C 219 366, 200 356, 200 338 Z" fill="none" stroke="url(#playHighlight)" stroke-width="3" />
  </g>
</svg>
